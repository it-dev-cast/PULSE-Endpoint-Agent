app = "REPLACE-ME-pulse-command-center"
primary_region = "sin"

[build]

[env]
  PORT = "8443"

[mounts]
  source = "command_center_data"
  destination = "/data"

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
