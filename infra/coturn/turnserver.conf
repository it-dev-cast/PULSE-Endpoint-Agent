# PRD §30 Remote Assist hardening - a single self-hosted coturn instance, appropriate for this
# project's real deployment scale (a handful of test devices, not the PRD's enterprise fleet).
# static-auth-secret is passed on the container command line (docker-compose.yml), not written
# here, so this file stays safe to commit - the real secret lives only in backend/.env.local's
# TURN_SECRET (see backend/turn.go's own comment) and whatever env var/secret file feeds it into
# the coturn container at deploy time.

listening-port=3478
fingerprint
use-auth-secret
realm=pulseendpoint.local

# A small relay port range on purpose - this project's real scale is a handful of concurrent
# support sessions, not the PRD's enterprise fleet. Each range slot is one relayed media stream;
# 64 ports comfortably covers many simultaneous screen-share/voice sessions at this scale without
# opening a large port range on the host firewall for no real benefit.
min-port=49160
max-port=49223

# This host's real Tailscale address (confirmed live: `Get-NetIPAddress`) - the same addressing
# scheme this project's test devices already use to reach each other (see ScreenSharePOC.tsx's
# own comment on Tailscale addressing) - not the Wi-Fi-local IP, which other test devices on
# different networks couldn't reach, defeating the point of having a TURN fallback at all.
external-ip=100.126.253.38

# Plain UDP relay, not TURNS (TLS-wrapped) - a deliberate v1 simplification, not an oversight:
# the actual media (screen/audio/chat/files) is already SRTP/DTLS-encrypted end-to-end by WebRTC
# itself regardless of this choice; TURNS would additionally encrypt the signaling-to-relay hop,
# a real but lesser concern at this project's real scale (an internal support tool, not a public
# service). Revisit if this ever serves untrusted/public traffic.
no-tls
no-dtls

# Reduces attack surface - coturn's own telnet-based admin CLI isn't needed here and this
# project has no operational reason to expose it.
no-cli

# Real, minimal logging to stdout (captured by `docker logs`) - no separate log-file volume
# needed at this scale.
log-file=stdout
