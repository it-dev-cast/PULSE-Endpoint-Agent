# Deploy target: /opt/commandcenter/compose.yaml on nexusone-dev-app-01 (192.168.0.36).
# Mirrors /opt/nexusone/compose.yaml's own shape exactly (postgres + api, private bridge network,
# named volume, host ports on 127.0.0.1 only) - a new, fully isolated stack, never sharing a
# container, volume, or network with nexusone/n8n/nexusauth's own.
#
# ./backend here is expected to be a checkout of this repo's backend/ directory (which now has
# its own Dockerfile) - same "build: ./app/api against a real checked-out source tree" pattern
# nexusone's own compose.yaml already uses, not a pre-built image.

services:
  postgres:
    image: postgres:17
    container_name: commandcenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - commandcenter_postgres_data:/var/lib/postgresql/data
    networks:
      - commandcenter_internal
    ports:
      # Host-side access for manual psql/pg_dump debugging only - the api container below talks
      # to this over the internal network via the "postgres" service name, not this port. 5433
      # is already nexusauth-postgres; 5434 is free (confirmed via `docker ps` at investigation
      # time).
      - "127.0.0.1:5434:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: commandcenter-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - commandcenter_internal
    ports:
      # Loopback-only, same as nexusone-api's own 127.0.0.1:8000:8000 - only nginx (running on
      # the host) needs to reach this; nothing container-side is ever directly internet-facing.
      - "127.0.0.1:8443:8443"

networks:
  commandcenter_internal:
    driver: bridge

volumes:
  commandcenter_postgres_data:
    name: commandcenter_postgres_data
