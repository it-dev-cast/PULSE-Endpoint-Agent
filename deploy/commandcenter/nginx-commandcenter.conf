# Deploy target: /etc/nginx/sites-available/commandcenter on nexusone-dev-app-01, symlinked into
# sites-enabled/ (same as /etc/nginx/sites-available/nexusone). Requires root to install -
# nothing here has been applied to the server until the site is symlinked in and reloaded.
#
# No TLS block: cloudflared runs in remotely-managed mode on this host (tunnel run --token-file,
# confirmed via its systemd unit) - Cloudflare's edge terminates HTTPS and forwards plain HTTP
# here, exactly like nexusone's own site. Getting commandcenter.casterly.com actually reachable
# still needs a Public Hostname route added in the Cloudflare Zero Trust dashboard pointing at
# this tunnel - that's a separate step outside SSH/this file.
#
# listen 80 (not 127.0.0.1:80) is deliberate, matching nexusone/nexusauth's own existing
# convention on this host - LAN-reachable directly by IP/hosts-file shortcut, in addition to via
# the tunnel.
#
# Static dashboard + API split lives entirely in THIS file, not a separate frontend container -
# nexusone-frontend does its split inside its own nginx:alpine container because its host nginx
# proxies to a single upstream port (8080) either way; commandcenter's backend is already exposed
# as a bare host-nginx -> 127.0.0.1:8443 proxy with no frontend container in front of it, so
# serving the static dist/ directly from here matches what's already built rather than adding a
# layer purely to mirror nexusone literally.

server {
    listen 80;
    listen [::]:80;

    server_name commandcenter.casterly.com;

    client_max_body_size 100M;

    root /opt/commandcenter/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Remote Assist's signaling channel (RemoteSessionViewer.jsx) is a raw WebSocket, not SSE -
    # scoped to this one path so only it carries Upgrade/Connection headers, rather than adding a
    # shared `map $http_upgrade ...` directive to the host's own /etc/nginx/nginx.conf (which every
    # other site on this box also includes).
    location ~ ^/v1/remote-sessions/.*/ws$ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 1d;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8443/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # The dashboard's live event stream (GET /v1/tenants/{id}/stream) is a real, long-lived
        # SSE connection - nginx's default proxy_read_timeout (60s) would silently kill it well
        # before any actual idle timeout matters, and default response buffering would batch/delay
        # events instead of streaming them as they arrive.
        proxy_read_timeout 1d;
        proxy_buffering off;
    }

    # Vite's own hashed build output (dist/assets/*.js|*.css|...) - safe to cache aggressively
    # since the filename itself changes on every rebuild. Scoped to actual file extensions, not a
    # bare /assets/ prefix, so it can't shadow any future app route that happens to start with the
    # same path segment (same bug nexusone's own frontend nginx.conf documents fixing).
    location ~* ^/assets/.+\.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|eot|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
